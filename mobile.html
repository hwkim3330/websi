<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e1e1e">
    <title>VelocityDRIVE-SP Mobile</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #1e1e1e;
            --bg-panel: #252526;
            --bg-header: #333333;
            --bg-hover: #2a2d2e;
            --bg-selected: #094771;
            --bg-input: #3c3c3c;
            --text-primary: #cccccc;
            --text-secondary: #858585;
            --text-highlight: #ffffff;
            --accent: #10b981;
            --accent-hover: #059669;
            --green: #4ec9b0;
            --blue: #569cd6;
            --yellow: #dcdcaa;
            --orange: #ce9178;
            --red: #f14c4c;
            --border: #3c3c3c;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            font-size: 14px;
            background: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.4;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* Header */
        .header {
            height: 56px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-title {
            font-weight: 600;
            font-size: 16px;
            color: var(--accent);
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--red);
        }

        .status-indicator.connected {
            background: var(--green);
        }

        .connect-btn {
            padding: 8px 16px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .connect-btn:active {
            background: var(--accent-hover);
        }

        .connect-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Main content area */
        .main-content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .panel {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            background: var(--bg-main);
        }

        .panel.active {
            display: flex;
        }

        /* Tree Panel */
        .tree-scroll {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 8px;
        }

        .tree-node {
            user-select: none;
        }

        .tree-node-header {
            display: flex;
            align-items: center;
            min-height: 44px;
            padding: 8px 12px;
            border-radius: 8px;
            gap: 8px;
        }

        .tree-node-header:active {
            background: var(--bg-hover);
        }

        .tree-node-header.selected {
            background: var(--bg-selected);
        }

        .tree-toggle {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .tree-toggle.expanded::before { content: '▼'; }
        .tree-toggle.collapsed::before { content: '▶'; }
        .tree-toggle.empty::before { content: ''; }

        .tree-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .tree-icon.folder { color: var(--yellow); }
        .tree-icon.container { color: var(--blue); }
        .tree-icon.list { color: var(--orange); }
        .tree-icon.leaf { color: var(--text-secondary); }

        .tree-node-name {
            flex: 1;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tree-node-badge {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg-input);
            padding: 2px 8px;
            border-radius: 12px;
        }

        .tree-children {
            display: none;
            margin-left: 16px;
        }

        .tree-children.expanded {
            display: block;
        }

        /* Value Panel */
        .value-header {
            padding: 12px 16px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border);
        }

        .value-path {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--accent);
            word-break: break-all;
        }

        .value-scroll {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .value-item {
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .value-name {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            color: var(--blue);
            margin-bottom: 4px;
        }

        .value-content {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            word-break: break-all;
        }

        .value-content.string { color: var(--orange); }
        .value-content.number { color: var(--green); }
        .value-content.boolean { color: var(--blue); }
        .value-content.null { color: var(--text-secondary); }
        .value-content.object { color: var(--yellow); }

        .value-type {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Info Panel */
        .info-card {
            background: var(--bg-panel);
            border-radius: 12px;
            margin: 12px;
            padding: 16px;
        }

        .info-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-highlight);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-secondary);
        }

        .info-value {
            font-family: 'IBM Plex Mono', monospace;
            color: var(--text-primary);
        }

        /* Placeholder */
        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }

        .placeholder svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Bottom Navigation */
        .bottom-nav {
            height: calc(60px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: var(--bg-header);
            border-top: 1px solid var(--border);
            display: flex;
            flex-shrink: 0;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 11px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 30, 30, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            z-index: 1000;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 70px;
            left: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
        }

        .toast {
            padding: 12px 16px;
            background: var(--bg-header);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .toast.success { border-left: 4px solid var(--green); }
        .toast.error { border-left: 4px solid var(--red); }
        .toast.info { border-left: 4px solid var(--blue); }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="status-indicator" id="statusIndicator"></span>
                <span class="app-title">VelocityDRIVE-SP</span>
            </div>
            <button class="connect-btn" id="connectBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                    <line x1="12" y1="2" x2="12" y2="12"></line>
                </svg>
                연결
            </button>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Tree Panel -->
            <div class="panel active" id="treePanel">
                <div class="tree-scroll" id="treeContainer">
                    <div class="placeholder">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10"/>
                        </svg>
                        <div>보드에 연결하면<br>YANG 데이터가 표시됩니다</div>
                    </div>
                </div>
            </div>

            <!-- Value Panel -->
            <div class="panel" id="valuePanel">
                <div class="value-header">
                    <div class="value-path" id="currentPath">/</div>
                </div>
                <div class="value-scroll" id="valueContainer">
                    <div class="placeholder">
                        <div>노드를 선택하세요</div>
                    </div>
                </div>
            </div>

            <!-- Info Panel -->
            <div class="panel" id="infoPanel">
                <div style="overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch;">
                    <div class="info-card">
                        <div class="info-title">시스템 정보</div>
                        <div class="info-row">
                            <span class="info-label">플랫폼</span>
                            <span class="info-value" id="infoPlatform">-</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">연결 상태</span>
                            <span class="info-value" id="infoStatus">연결 안됨</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">카탈로그</span>
                            <span class="info-value" id="infoCatalog">-</span>
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-title">YANG 모듈</div>
                        <div id="infoModules">-</div>
                    </div>
                    <div class="info-card">
                        <div class="info-title">정보</div>
                        <div style="color: var(--text-secondary); font-size: 13px;">
                            VelocityDRIVE-SP YANG Browser<br>
                            WebSerial API 기반<br><br>
                            지원 보드: LAN9662, LAN9692
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-panel="treePanel">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>
                </svg>
                트리
            </div>
            <div class="nav-item" data-panel="valuePanel">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
                    <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                </svg>
                값
            </div>
            <div class="nav-item" data-panel="infoPanel">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="16" x2="12" y2="12"/>
                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
                정보
            </div>
        </nav>
    </div>

    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div id="loadingText">로딩 중...</div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/cbor.min.js"></script>
    <script type="module" src="js/mobile.js"></script>
</body>
</html>
