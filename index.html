<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VelocityDRIVE-SP WebSerial</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><rect x='3' y='3' width='18' height='18' rx='3'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="3" y="3" width="18" height="18" rx="3"/>
                        <rect x="7" y="7" width="4" height="4" rx="1" fill="white"/>
                        <rect x="13" y="7" width="4" height="4" rx="1" fill="white"/>
                        <rect x="7" y="13" width="4" height="4" rx="1" fill="white"/>
                        <rect x="13" y="13" width="4" height="4" rx="1" fill="white"/>
                    </svg>
                    <div class="logo-text">
                        <span class="logo-title">VelocityDRIVE-SP</span>
                        <span class="logo-sub">LAN9662 TSN Switch</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div class="connection-badge" id="connectionBadge">
                    <span class="badge-dot"></span>
                    <span class="badge-text">연결 안됨</span>
                </div>
                <button class="btn-connect" id="connectBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                    <span>연결</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Column: Status & Control -->
            <div class="column column-left">
                <!-- Device Status Card -->
                <section class="card" id="deviceCard">
                    <div class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="4" y="4" width="16" height="16" rx="2"/>
                            <circle cx="12" cy="12" r="2"/>
                        </svg>
                        <span>디바이스</span>
                    </div>
                    <div class="card-content">
                        <div class="device-status" id="deviceStatus">
                            <div class="status-row">
                                <span class="status-label">상태</span>
                                <span class="status-value status-disconnected" id="statusValue">대기 중</span>
                            </div>
                            <div class="status-row">
                                <span class="status-label">플랫폼</span>
                                <span class="status-value mono" id="platformValue">-</span>
                            </div>
                            <div class="status-row">
                                <span class="status-label">버전</span>
                                <span class="status-value mono" id="versionValue">-</span>
                            </div>
                            <div class="status-row">
                                <span class="status-label">YANG</span>
                                <span class="status-value mono" id="yangValue">-</span>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Port Status Card -->
                <section class="card" id="portCard">
                    <div class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="6" width="4" height="12" rx="1"/>
                            <rect x="10" y="6" width="4" height="12" rx="1"/>
                            <rect x="18" y="6" width="4" height="12" rx="1"/>
                        </svg>
                        <span>포트</span>
                    </div>
                    <div class="card-content">
                        <div class="port-grid" id="portGrid">
                            <div class="port-item">
                                <div class="port-icon port-down">1</div>
                                <span class="port-name">eth0</span>
                            </div>
                            <div class="port-item">
                                <div class="port-icon port-down">2</div>
                                <span class="port-name">eth1</span>
                            </div>
                            <div class="port-item">
                                <div class="port-icon port-down">3</div>
                                <span class="port-name">eth2</span>
                            </div>
                            <div class="port-item">
                                <div class="port-icon port-down">4</div>
                                <span class="port-name">eth3</span>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Quick Actions -->
                <section class="card">
                    <div class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                        </svg>
                        <span>빠른 명령</span>
                    </div>
                    <div class="card-content">
                        <div class="action-grid">
                            <button class="action-btn" id="getChecksumBtn" disabled>체크섬</button>
                            <button class="action-btn" id="fetchSystemBtn" disabled>시스템</button>
                            <button class="action-btn" id="fetchBridgeBtn" disabled>브릿지</button>
                            <button class="action-btn" id="fetchInterfacesBtn" disabled>인터페이스</button>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Right Column: Configuration -->
            <div class="column column-right">
                <!-- Tabs -->
                <div class="tabs" id="mainTabs">
                    <button class="tab active" data-tab="query">조회</button>
                    <button class="tab" data-tab="tsn">TSN 설정</button>
                    <button class="tab" data-tab="terminal">터미널</button>
                </div>

                <!-- Tab Contents -->
                <div class="tab-contents">
                    <!-- Query Tab -->
                    <div class="tab-content active" id="queryTab">
                        <div class="query-section">
                            <label>YANG 경로</label>
                            <div class="input-row">
                                <input type="text" class="input" id="yangPathInput"
                                       placeholder="/ietf-system:system-state/platform">
                                <button class="btn-primary" id="fetchBtn" disabled>조회</button>
                            </div>
                            <div class="quick-paths">
                                <button class="path-btn" data-path="/ietf-system:system-state/platform">platform</button>
                                <button class="path-btn" data-path="/ietf-interfaces:interfaces">interfaces</button>
                                <button class="path-btn" data-path="/ieee802-dot1q-bridge:bridges">bridges</button>
                                <button class="path-btn" data-path="/ieee1588-ptp:ptp">ptp</button>
                            </div>
                        </div>
                        <div class="result-section">
                            <div class="result-header">
                                <span>결과</span>
                                <button class="btn-icon" id="copyResultBtn" title="복사">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="9" y="9" width="13" height="13" rx="2"/>
                                        <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                                    </svg>
                                </button>
                            </div>
                            <pre class="result-content" id="fetchResult">// 조회 결과</pre>
                        </div>
                    </div>

                    <!-- TSN Tab -->
                    <div class="tab-content" id="tsnTab">
                        <div class="tsn-grid">
                            <!-- CBS -->
                            <div class="tsn-card">
                                <h4>CBS (802.1Qav)</h4>
                                <p>Credit-Based Shaper</p>
                                <div class="form-grid">
                                    <div class="form-field">
                                        <label>Port</label>
                                        <select class="input" id="cbsPort">
                                            <option value="1">Port 1</option>
                                            <option value="2">Port 2</option>
                                            <option value="3">Port 3</option>
                                            <option value="4">Port 4</option>
                                        </select>
                                    </div>
                                    <div class="form-field">
                                        <label>TC</label>
                                        <select class="input" id="cbsTc">
                                            <option value="2">TC2</option>
                                            <option value="6">TC6</option>
                                        </select>
                                    </div>
                                    <div class="form-field full">
                                        <label>Idle Slope (bps)</label>
                                        <input type="number" class="input" id="cbsIdleSlope" value="1500000">
                                    </div>
                                </div>
                                <button class="btn-primary" id="applyCbsBtn" disabled>적용</button>
                            </div>

                            <!-- TAS -->
                            <div class="tsn-card">
                                <h4>TAS (802.1Qbv)</h4>
                                <p>Time-Aware Shaper</p>
                                <div class="form-grid">
                                    <div class="form-field">
                                        <label>Port</label>
                                        <select class="input" id="tasPort">
                                            <option value="1">Port 1</option>
                                            <option value="2">Port 2</option>
                                            <option value="3">Port 3</option>
                                            <option value="4">Port 4</option>
                                        </select>
                                    </div>
                                    <div class="form-field">
                                        <label>Cycle (ms)</label>
                                        <input type="number" class="input" id="tasCycle" value="200">
                                    </div>
                                </div>
                                <button class="btn-primary" id="applyTasBtn" disabled>적용</button>
                            </div>

                            <!-- PTP -->
                            <div class="tsn-card">
                                <h4>PTP (1588)</h4>
                                <p>Precision Time Protocol</p>
                                <div class="form-grid">
                                    <div class="form-field full">
                                        <label>Mode</label>
                                        <select class="input" id="ptpMode">
                                            <option value="bc">Boundary Clock</option>
                                            <option value="tc">Transparent Clock</option>
                                        </select>
                                    </div>
                                </div>
                                <button class="btn-primary" id="applyPtpBtn" disabled>적용</button>
                            </div>

                            <!-- FRER -->
                            <div class="tsn-card disabled">
                                <h4>FRER (802.1CB)</h4>
                                <p>Frame Replication</p>
                                <div class="coming-soon">준비 중</div>
                            </div>
                        </div>
                    </div>

                    <!-- Terminal Tab -->
                    <div class="tab-content" id="terminalTab">
                        <div class="terminal-toolbar">
                            <button class="btn-icon" id="clearTerminalBtn" title="지우기">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/>
                                    <path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                                </svg>
                            </button>
                            <label class="toggle-label">
                                <input type="checkbox" id="autoScrollCheck" checked>
                                <span>자동 스크롤</span>
                            </label>
                            <label class="toggle-label">
                                <input type="checkbox" id="showHexCheck">
                                <span>HEX</span>
                            </label>
                        </div>
                        <div class="terminal-output" id="terminalOutput">
                            <div class="terminal-line system">터미널 준비됨</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">처리 중...</div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="js/cbor.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
